<!doctype html>
<!-- The "page not found" page. Built into /404.html by build.mjs; GitHub Pages serves it for any
     address that doesn't exist, so its links stay root paths. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ seo.title }}</title>
  <meta name="robots" content="noindex">
  <meta name="portfolio-analytics" content="{{ site.analytics_url }}" data-path="">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>document.documentElement.classList.add('js'); (function () { try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {} })();</script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@700;800&display=swap">
  <link rel="stylesheet" href="{{ v "css/site.css" }}">
</head>
<body>
  <main class="not-found" id="page-404">
    <div class="hero-grid-bg" aria-hidden="true"></div>
    <p class="mono not-found-code">404 · signal lost</p>
    <h1 class="section-title">This page doesn’t exist.</h1>
    <p class="section-intro">The link may be old, or the address mistyped.</p>
    <p><a class="btn btn-primary" href="/">Go to {{ profile.name }}’s portfolio</a></p>
  </main>
  <script src="{{ v "js/site.js" }}" defer></script>
</body>
</html>
